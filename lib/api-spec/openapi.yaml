openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: StreamPractice AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Practice session management
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List all practice sessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a new practice session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get session details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update a session (e.g. end it)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sessions/{id}/messages:
    get:
      operationId: listSessionMessages
      tags: [sessions]
      summary: List chat messages in a session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: addSessionMessage
      tags: [sessions]
      summary: Add a chat message (agent response)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMessageBody"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /sessions/{id}/agent-response:
    post:
      operationId: generateAgentResponse
      tags: [sessions]
      summary: Generate an AI agent response based on voice transcript and screen context
      description: Sends transcript + screen context to AI and streams back agent chat messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentResponseBody"
      responses:
        "200":
          description: SSE stream of agent chat messages
          content:
            text/event-stream: {}

  /sessions/{id}/analytics:
    get:
      operationId: getSessionAnalytics
      tags: [sessions]
      summary: Get post-session analytics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAnalytics"

  /sessions/stats/summary:
    get:
      operationId: getSessionsSummary
      tags: [sessions]
      summary: Get aggregate stats across all sessions
      responses:
        "200":
          description: Sessions summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsSummary"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /openai/conversations/{id}/voice-messages:
    post:
      operationId: sendOpenaiVoiceMessage
      tags: [openai]
      summary: Send audio and receive a streaming voice response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiVoiceMessageBody"
      responses:
        "200":
          description: SSE stream of transcript and audio chunks
          content:
            text/event-stream: {}
  /openai/generate-image:
    post:
      operationId: generateOpenaiImage
      tags: [openai]
      summary: Generate an image from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateOpenaiImageBody"
      responses:
        "200":
          description: Generated image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateOpenaiImageResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Session:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        difficulty:
          type: string
          enum: [chill, medium, viral]
        status:
          type: string
          enum: [active, ended]
        durationMinutes:
          type: integer
        activeAgents:
          type: array
          items:
            type: string
        totalMessages:
          type: integer
        silenceGaps:
          type: integer
        talkTimeSeconds:
          type: integer
        createdAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - title
        - difficulty
        - status
        - durationMinutes
        - activeAgents
        - totalMessages
        - silenceGaps
        - talkTimeSeconds
        - createdAt

    SessionWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        difficulty:
          type: string
          enum: [chill, medium, viral]
        status:
          type: string
          enum: [active, ended]
        durationMinutes:
          type: integer
        activeAgents:
          type: array
          items:
            type: string
        totalMessages:
          type: integer
        silenceGaps:
          type: integer
        talkTimeSeconds:
          type: integer
        createdAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - id
        - title
        - difficulty
        - status
        - durationMinutes
        - activeAgents
        - totalMessages
        - silenceGaps
        - talkTimeSeconds
        - createdAt
        - messages

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        agentType:
          type: string
        agentName:
          type: string
        content:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - sessionId
        - agentType
        - agentName
        - content
        - timestamp

    CreateSessionBody:
      type: object
      properties:
        title:
          type: string
        difficulty:
          type: string
          enum: [chill, medium, viral]
        durationMinutes:
          type: integer
        activeAgents:
          type: array
          items:
            type: string
      required:
        - title
        - difficulty
        - durationMinutes
        - activeAgents

    UpdateSessionBody:
      type: object
      properties:
        status:
          type: string
          enum: [active, ended]
        talkTimeSeconds:
          type: integer
        silenceGaps:
          type: integer

    AddMessageBody:
      type: object
      properties:
        agentType:
          type: string
        agentName:
          type: string
        content:
          type: string
      required:
        - agentType
        - agentName
        - content

    AgentResponseBody:
      type: object
      properties:
        transcript:
          type: string
          description: Current voice transcript from STT
        screenContext:
          type: string
          description: Description of screen content (from screen capture analysis)
        difficulty:
          type: string
          enum: [chill, medium, viral]
        activeAgents:
          type: array
          items:
            type: string
        recentMessages:
          type: array
          items:
            type: string
      required:
        - transcript
        - difficulty
        - activeAgents

    SessionAnalytics:
      type: object
      properties:
        sessionId:
          type: integer
        totalTalkTimeSeconds:
          type: integer
        totalSilenceGaps:
          type: integer
        longestSilenceSeconds:
          type: integer
        chatResponseRate:
          type: number
        energyScore:
          type: number
        totalMessages:
          type: integer
        agentBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/AgentStat"
        tips:
          type: array
          items:
            type: string
      required:
        - sessionId
        - totalTalkTimeSeconds
        - totalSilenceGaps
        - longestSilenceSeconds
        - chatResponseRate
        - energyScore
        - totalMessages
        - agentBreakdown
        - tips

    AgentStat:
      type: object
      properties:
        agentType:
          type: string
        messageCount:
          type: integer
      required:
        - agentType
        - messageCount

    SessionsSummary:
      type: object
      properties:
        totalSessions:
          type: integer
        totalTalkTimeMinutes:
          type: integer
        avgEnergyScore:
          type: number
        avgResponseRate:
          type: number
        totalMessages:
          type: integer
        recentSessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
      required:
        - totalSessions
        - totalTalkTimeMinutes
        - avgEnergyScore
        - avgResponseRate
        - totalMessages
        - recentSessions

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    CreateOpenaiConversationBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    SendOpenaiMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    SendOpenaiVoiceMessageBody:
      type: object
      properties:
        audio:
          type: string
          description: Base64-encoded audio data
      required:
        - audio
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    GenerateOpenaiImageBody:
      type: object
      properties:
        prompt:
          type: string
        size:
          type: string
          enum: ["1024x1024", "512x512", "256x256"]
      required:
        - prompt
    GenerateOpenaiImageResponse:
      type: object
      properties:
        b64_json:
          type: string
      required:
        - b64_json
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
